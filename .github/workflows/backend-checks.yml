name: Backend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/auth-workspaces-curriculum-ai]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/teachgenius_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/teachgenius_ci
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: yarn install --non-interactive
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Generate initial database SQL preview
        run: npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script
      - name: Type-check
        run: yarn typecheck
      - name: Build
        run: yarn build
